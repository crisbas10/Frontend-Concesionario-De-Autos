<div class="page-head">
  <h1>Vehículos</h1>
  <button mat-flat-button color="primary" (click)="nuevo()"><mat-icon>add</mat-icon> Nuevo</button>
</div>
@if (loading) { <div class="loading"><mat-spinner /></div> } @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let r">{{ r.id }}</td></ng-container>
      <ng-container matColumnDef="marca"><th mat-header-cell *matHeaderCellDef>Marca</th><td mat-cell *matCellDef="let r">{{ r.marca }}</td></ng-container>
      <ng-container matColumnDef="modelo"><th mat-header-cell *matHeaderCellDef>Modelo</th><td mat-cell *matCellDef="let r">{{ r.modelo }}</td></ng-container>
      <ng-container matColumnDef="anio"><th mat-header-cell *matHeaderCellDef>Año</th><td mat-cell *matCellDef="let r">{{ r.anio }}</td></ng-container>
      <ng-container matColumnDef="precio"><th mat-header-cell *matHeaderCellDef>Precio</th><td mat-cell *matCellDef="let r">$ {{ r.precio | number:'1.0-0' }}</td></ng-container>
      <ng-container matColumnDef="estado"><th mat-header-cell *matHeaderCellDef>Estado</th><td mat-cell *matCellDef="let r">{{ r.estado }}</td></ng-container>
      <ng-container matColumnDef="disponibilidad"><th mat-header-cell *matHeaderCellDef>Disponible</th>
        <td mat-cell *matCellDef="let r">
          <mat-chip [color]="r.disponibilidad ? 'primary' : 'warn'" highlighted>{{ r.disponibilidad ? 'Sí' : 'No' }}</mat-chip>
        </td>
      </ng-container>
      <ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button (click)="eliminar(r)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5,10,25]" showFirstLastButtons />
  </div>
}
