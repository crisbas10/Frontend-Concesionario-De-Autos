<div class="page-head">
  <h1>Ventas</h1>
  <button mat-flat-button color="primary" (click)="nuevo()"><mat-icon>add</mat-icon> Nueva venta</button>
</div>
@if (loading) { <div class="loading"><mat-spinner /></div> } @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let r">{{ r.id }}</td></ng-container>
      <ng-container matColumnDef="empleado_id"><th mat-header-cell *matHeaderCellDef>Empleado</th><td mat-cell *matCellDef="let r">{{ r.empleado_id }}</td></ng-container>
      <ng-container matColumnDef="cliente_id"><th mat-header-cell *matHeaderCellDef>Cliente</th><td mat-cell *matCellDef="let r">{{ r.cliente_id }}</td></ng-container>
      <ng-container matColumnDef="vehiculo_id"><th mat-header-cell *matHeaderCellDef>Vehículo</th><td mat-cell *matCellDef="let r">{{ r.vehiculo_id }}</td></ng-container>
      <ng-container matColumnDef="metodo_pago_id"><th mat-header-cell *matHeaderCellDef>Método pago</th><td mat-cell *matCellDef="let r">{{ r.metodo_pago_id }}</td></ng-container>
      <ng-container matColumnDef="fecha"><th mat-header-cell *matHeaderCellDef>Fecha</th><td mat-cell *matCellDef="let r">{{ r.fecha | date:'dd/MM/yyyy' }}</td></ng-container>
      <ng-container matColumnDef="precio_final"><th mat-header-cell *matHeaderCellDef>Precio final</th><td mat-cell *matCellDef="let r">$ {{ r.precio_final | number:'1.0-0' }}</td></ng-container>
      <ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button (click)="eliminar(r)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5,10,25]" showFirstLastButtons />
  </div>
}
