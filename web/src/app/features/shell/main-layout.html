<mat-sidenav-container #sidenavShell="matSidenavContainer" class="shell" autosize>
  <mat-sidenav mode="side" opened class="nav-rail" [class.collapsed]="sidebarCollapsed()">
    <div class="nav-brand">
      <div class="nav-brand__mark">
        <mat-icon class="nav-brand__icon">directions_car</mat-icon>
      </div>
      @if (!sidebarCollapsed()) {
        <div class="nav-brand__text">
          <span class="nav-brand__title">Concesionario</span>
          <span class="nav-brand__sub">Panel de gestión</span>
        </div>
      }
    </div>
    <mat-nav-list class="nav-list">
      @for (item of nav; track item.path) {
        <a mat-list-item class="nav-item" [routerLink]="item.path" routerLinkActive="active-link"
          [matTooltip]="sidebarCollapsed() ? item.label : ''" matTooltipPosition="right"
          [matTooltipDisabled]="!sidebarCollapsed()">
          <mat-icon matListItemIcon class="nav-item__icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="nav-footer">
      <button mat-stroked-button type="button" class="collapse-btn" (click)="toggleSidebar()"
        [matTooltip]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'" matTooltipPosition="right">
        <mat-icon>{{ sidebarCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        @if (!sidebarCollapsed()) { <span>Ocultar menú</span> }
      </button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="main-column">
    <mat-toolbar class="top-bar">
      <button mat-icon-button type="button" (click)="toggleSidebar()" aria-label="Alternar menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Concesionario de Autos</span>
      <span class="spacer"></span>
      <mat-form-field appearance="outline" class="audit-field" subscriptSizing="dynamic">
        <mat-label>Usuario activo</mat-label>
        <mat-select [value]="audit.usuarioId()" (selectionChange)="onUsuarioAudit($event.value)">
          @for (u of usuarios(); track u.id) {
            <mat-option [value]="u.id">{{ u.nombre_usuario }} ({{ u.rol }})</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <button mat-icon-button type="button" (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content">
      <div class="content-inner">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
